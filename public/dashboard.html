<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Remedy - Nani Ki Nushke</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header>
  <a href="index.html" class="logo"><span>🌿</span> Nani Ki Nushke</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html" class="active">+ Add Remedy</a>
    <a href="profile.html">My Profile</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>
</header>

<div class="page-container">
  <h1 class="page-title">Share a Remedy 🌿</h1>
  <p class="page-sub">Share a home remedy with the community</p>

  <div class="form-card">
    <div class="error-msg" id="errMsg"></div>
    <div class="success-msg" id="sucMsg"></div>

    <div class="form-group">
      <label>Remedy Title *</label>
      <input type="text" id="title" placeholder="e.g. Turmeric Milk for Cold"/>
    </div>

    <div class="form-group">
      <label>Category *</label>
      <select id="category">
        <option value="Cold & Cough">🤧 Cold & Cough</option>
        <option value="Digestion">🫁 Digestion</option>
        <option value="Skin Care">✨ Skin Care</option>
        <option value="Hair Care">💆 Hair Care</option>
        <option value="Immunity">🛡️ Immunity</option>
        <option value="Pain Relief">💊 Pain Relief</option>
        <option value="Sleep">😴 Sleep</option>
        <option value="General" selected>🌱 General</option>
      </select>
    </div>

    <div class="form-group">
      <label>Ingredients</label>
      <textarea id="ingredients" placeholder="e.g. 1 tsp turmeric, 1 cup warm milk, pinch of black pepper, honey to taste"></textarea>
    </div>

    <div class="form-group">
      <label>How to Use / Instructions *</label>
      <textarea id="description" placeholder="Describe how to prepare and use this remedy..."></textarea>
    </div>

    <button class="btn-primary" onclick="addRemedy()" id="postBtn">Post Remedy 🌿</button>
  </div>
</div>

<div id="toast"></div>

<script>
  const email = localStorage.getItem("email");
  const username = localStorage.getItem("username");

  if (!email) window.location = "login.html";

  function logout() {
    localStorage.clear();
    window.location = "index.html";
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  async function addRemedy() {
    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const ingredients = document.getElementById("ingredients").value.trim();
    const description = document.getElementById("description").value.trim();
    const errEl = document.getElementById("errMsg");
    const sucEl = document.getElementById("sucMsg");
    const btn = document.getElementById("postBtn");

    errEl.style.display = "none";
    sucEl.style.display = "none";

    if (!title || !description) {
      errEl.textContent = "Title and instructions are required";
      errEl.style.display = "block";
      return;
    }

    btn.textContent = "Posting...";
    btn.disabled = true;

    try {
      const res = await fetch("http://localhost:5000/api/remedy/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, description, ingredients, category, userEmail: email, userName: username || email })
      });

      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.message || "Failed to post";
        errEl.style.display = "block";
        btn.textContent = "Post Remedy 🌿";
        btn.disabled = false;
        return;
      }

      sucEl.textContent = "Remedy posted successfully! 🌿 Redirecting...";
      sucEl.style.display = "block";

      // Clear form
      document.getElementById("title").value = "";
      document.getElementById("ingredients").value = "";
      document.getElementById("description").value = "";

      setTimeout(() => window.location = "index.html", 1200);
    } catch {
      errEl.textContent = "Server error";
      errEl.style.display = "block";
      btn.textContent = "Post Remedy 🌿";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
