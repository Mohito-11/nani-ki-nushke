<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Nani Ki Nushke</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-brand">
      <div class="logo-text">🌿 Nani Ki Nushke</div>
      <p>Join the community of remedy seekers</p>
    </div>
    <h2>Create Account</h2>

    <div class="error-msg" id="errMsg"></div>
    <div class="success-msg" id="sucMsg"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your name"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" onkeydown="if(event.key==='Enter') register()"/>
    </div>

    <button class="btn-primary" onclick="register()" id="regBtn">Create Account</button>

    <div class="auth-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem("email")) window.location = "index.html";

  async function register() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errEl = document.getElementById("errMsg");
    const sucEl = document.getElementById("sucMsg");
    const btn = document.getElementById("regBtn");

    errEl.style.display = "none";
    sucEl.style.display = "none";

    if (!name || !email || !password) {
      errEl.textContent = "Please fill in all fields";
      errEl.style.display = "block";
      return;
    }

    if (password.length < 6) {
      errEl.textContent = "Password must be at least 6 characters";
      errEl.style.display = "block";
      return;
    }

    btn.textContent = "Creating account...";
    btn.disabled = true;

    try {
      const res = await fetch("http://localhost:5000/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.message || "Registration failed";
        errEl.style.display = "block";
        btn.textContent = "Create Account";
        btn.disabled = false;
        return;
      }

      sucEl.textContent = "Account created! Redirecting to login...";
      sucEl.style.display = "block";
      setTimeout(() => window.location = "login.html", 1200);
    } catch {
      errEl.textContent = "Server error. Is the backend running?";
      errEl.style.display = "block";
      btn.textContent = "Create Account";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
